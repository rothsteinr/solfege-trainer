<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solfège Trainer</title>
<meta name="description" content="Fixed-do solfège course on Danhauser's Solfège des Solfèges, Book 1, with pitch feedback.">
<meta name="theme-color" content="#1f3f9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solfège">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  /* Conservatory study sheet: cool paper, ink, one cobalt accent; scores always sit on white paper. */
  --bg: #f3f5f8;
  --card: #ffffff;
  --ink: #161a23;
  --muted: #5a6373;
  --line: #e1e5ec;
  --accent: #2448b8;
  --accent-ink: #ffffff;
  --accent-soft: #e7ecfa;
  --good: #17845a;
  --close: #b06d0b;
  --off: #c23a2b;
  --page: #ffffff;
  --page-ink: #111111;
  --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --card: #171b23; --ink: #e8ebf1; --muted: #9ca5b4; --line: #2a303c;
    --accent: #8aa4ff; --accent-ink: #0f1218; --accent-soft: #1f2840;
    --good: #43c08a; --close: #e0a33a; --off: #f0705f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --card: #171b23; --ink: #e8ebf1; --muted: #9ca5b4; --line: #2a303c;
  --accent: #8aa4ff; --accent-ink: #0f1218; --accent-soft: #1f2840;
  --good: #43c08a; --close: #e0a33a; --off: #f0705f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-text-size-adjust: 100%;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
a { color: var(--accent); }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; letter-spacing: .01em; display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); }
.brand small { font-family: var(--font-body); font-size: .78rem; color: var(--muted); font-weight: 400; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; font-size: .95rem; }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 64px; display: grid; gap: 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: grid; gap: 14px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: grid; gap: 10px; }
.prose { max-width: 65ch; display: grid; gap: 10px; }

.btn {
  border: 1px solid var(--line); background: var(--card); padding: 8px 14px; border-radius: 8px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; font-size: .95rem; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn .ico { font-size: 1rem; line-height: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; min-height: 38px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; }
.stepper button { border: 0; background: transparent; width: 36px; height: 38px; cursor: pointer; font-size: 1.1rem; }
.stepper output { min-width: 84px; text-align: center; font-variant-numeric: tabular-nums; font-size: .92rem; }

/* course */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.unit { display: grid; gap: 8px; }
.unit-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.lesson-link {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--card);
}
.lesson-link:hover { border-color: var(--accent); }
.lesson-link .num { font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.lesson-link .t { font-size: .95rem; line-height: 1.25; }
.lesson-link .t small { display: block; color: var(--muted); font-size: .8rem; }
.lesson-link.next { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.pill { font-size: .78rem; padding: 2px 8px; border-radius: 99px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.pass { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.try { background: color-mix(in srgb, var(--close) 16%, transparent); color: var(--close); }
.pill.none { color: var(--muted); border: 1px solid var(--line); }

/* lesson */
.lesson-head { display: grid; gap: 4px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; counter-reset: step; }
.steps button {
  border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 14px 6px 8px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; font-size: .92rem; min-height: 38px;
}
.steps button::before {
  counter-increment: step; content: counter(step); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  font-size: .78rem; font-weight: 700; background: var(--line); color: var(--muted);
}
.steps button[aria-current="step"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.steps button[aria-current="step"]::before { background: var(--accent); color: var(--accent-ink); }
.steps button.done::before { content: "✓"; background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }

.page { background: var(--page); color: var(--page-ink); border-radius: 8px; border: 1px solid var(--line); padding: 8px 4px; overflow-x: auto; }
.page svg { display: block; }
.score-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.score-tools .sep { width: 1px; height: 28px; background: var(--line); }

/* note states (SVG groups from VexFlow) */
.vf-stavenote.is-current path, .vf-stavenote.is-current rect { fill: #2448b8 !important; stroke: #2448b8 !important; }
.vf-stavenote.is-good path, .vf-stavenote.is-good rect { fill: #17845a !important; stroke: #17845a !important; }
.vf-stavenote.is-close path, .vf-stavenote.is-close rect { fill: #b06d0b !important; stroke: #b06d0b !important; }
.vf-stavenote.is-off path, .vf-stavenote.is-off rect { fill: #c23a2b !important; stroke: #c23a2b !important; }
.vf-stavenote.is-missed path { fill: #9aa1ad !important; stroke: #9aa1ad !important; }
.vf-stavenote.is-dim path { fill: #c5c9d1 !important; stroke: #c5c9d1 !important; }
.vf-stavenote text { fill: #333 !important; }
.vf-stavenote.is-current text { fill: #2448b8 !important; font-weight: 700; }
.vf-stavenote.is-good text { fill: #17845a !important; }
.vf-stavenote.is-close text { fill: #b06d0b !important; }
.vf-stavenote.is-off text { fill: #c23a2b !important; }

.tuner { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.tuner .big { font-family: var(--font-display); font-size: 2rem; font-weight: 600; min-width: 3.2ch; text-align: center; line-height: 1; }
.tuner .target { font-size: .82rem; color: var(--muted); text-align: center; }
.meter { position: relative; height: 34px; }
.meter .scale { position: absolute; inset: 15px 0 auto 0; height: 4px; border-radius: 4px;
  background: linear-gradient(90deg, var(--off) 0 15%, var(--close) 15% 37.5%, var(--good) 37.5% 62.5%, var(--close) 62.5% 85%, var(--off) 85% 100%); opacity: .55; }
.meter .needle { position: absolute; top: 4px; width: 3px; height: 26px; background: var(--ink); border-radius: 2px; left: 50%; transform: translateX(-50%); transition: left .08s linear; }
.meter .ticks { position: absolute; inset: auto 0 -14px 0; display: flex; justify-content: space-between; font-size: .7rem; color: var(--muted); }
.tuner .cents { font-variant-numeric: tabular-nums; min-width: 6ch; text-align: right; font-size: .95rem; }

.result { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; border-radius: 8px; padding: 14px 16px; border: 1px solid var(--line); }
.result .score { font-family: var(--font-display); font-size: 2.4rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.result.pass { border-color: var(--good); }
.result.pass .score { color: var(--good); }
.result.fail .score { color: var(--close); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: currentColor; }
.legend .g { color: var(--good); } .legend .c { color: var(--close); } .legend .o { color: var(--off); } .legend .m { color: #9aa1ad; }

.notice { border-left: 3px solid var(--close); background: color-mix(in srgb, var(--close) 10%, transparent); padding: 10px 14px; border-radius: 6px; font-size: .92rem; }
.notice.info { border-color: var(--accent); background: var(--accent-soft); }

/* reading drill */
.drill { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 20px; align-items: start; }
.drill-note { display: grid; place-items: center; min-height: 190px; }
.drill-note svg { width: min(100%, 360px); height: auto; }
.answers { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.answers button {
  border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 12px 0; cursor: pointer; font-size: 1.05rem;
  font-family: var(--font-display); font-weight: 600; min-height: 52px;
}
.answers button:hover { border-color: var(--accent); }
.answers button.right { background: color-mix(in srgb, var(--good) 18%, transparent); border-color: var(--good); color: var(--good); }
.answers button.wrong { background: color-mix(in srgb, var(--off) 15%, transparent); border-color: var(--off); color: var(--off); }
.answers kbd { display: block; font-family: var(--font-body); font-size: .68rem; color: var(--muted); font-weight: 400; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--font-display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; color: var(--muted); }
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
.heat div { border-radius: 6px; padding: 4px; text-align: center; font-size: .78rem; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.heat div b { display: block; font-family: var(--font-display); font-size: .95rem; }
.flash { font-size: .95rem; min-height: 1.5em; text-align: center; }

.keys { display: flex; gap: 6px; flex-wrap: wrap; }
.keys button { min-width: 64px; }

.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-weight: 600; font-size: .95rem; }
textarea { width: 100%; min-height: 90px; font: .85rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); color: var(--ink); }
input[type="number"] { width: 72px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--card); }

footer { max-width: 1080px; margin: 0 auto; padding: 0 16px 40px; color: var(--muted); font-size: .82rem; }

@media (max-width: 720px) {
  h1 { font-size: 1.5rem; }
  .hero { grid-template-columns: 1fr; }
  .drill { grid-template-columns: 1fr; }
  nav { margin-left: 0; width: 100%; }
  .card { padding: 16px; }
  .answers button { font-size: .95rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#home">Solfège <small>fixed do · Danhauser Book 1</small></a>
    <nav aria-label="Main">
      <a href="#home" data-nav="home">Course</a>
      <a href="#reading" data-nav="reading">Reading</a>
      <a href="#scales" data-nav="scales">Scales</a>
      <a href="#settings" data-nav="settings">Settings</a>
    </nav>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer>Lessons from A. Danhauser, <i>Solfège des Solfèges</i>, Book 1, tr. J. H. Cornell (G. Schirmer, 1891). Public domain.</footer>
<script src="vexflow.js?v=3"></script>
<script src="core.js?v=3"></script>
<script src="lessons.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
